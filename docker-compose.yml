version: '3.8'

services:
  service_postgres:
    image: postgres:14
    container_name: container_postgres
    environment:
      POSTGRES_USER: hedve
      POSTGRES_PASSWORD: hedve
      POSTGRES_DB: hedve
    ports:
      - "5432:5432"
    volumes:
      - volume_postgres:/var/lib/postgresql/data

  service_redis:
    image: redis:7-alpine
    container_name: container_redis
    ports:
      - "6379:6379"
    volumes:
      - volume_redis:/data

  service_pgadmin:
    image: dpage/pgadmin4:6.11
    container_name: container_pgadmin
    ports:
      - 8080:80
    volumes:
      - volume_pgadmin:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: example@example.com
      PGADMIN_DEFAULT_PASSWORD: password
    depends_on:
      - service_postgres

volumes:
  volume_postgres:
    name: vpg
  volume_pgadmin:
    name: vpga
  volume_redis:
    name: vredis

